name: Solar README

on:
  schedule:
    # 01:23 UTC daily — off the hour, so it isn't queued behind everyone else's
    - cron: '23 1 * * *'
  workflow_dispatch:        # lets you run it by hand from the Actions tab
  push:
    branches: [main]
    paths:
      - 'scripts/**'
      - '.github/workflows/solar-readme.yml'

permissions:
  contents: write

concurrency:
  group: solar-readme
  cancel-in-progress: true

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Render the panels
        env:
          # SOLAR_TOKEN is optional: a classic PAT with read:user makes the
          # contribution graph (and private contributions) available.
          GITHUB_TOKEN: ${{ secrets.SOLAR_TOKEN || secrets.GITHUB_TOKEN }}
          GH_USER: ${{ github.repository_owner }}
          FOOTER_MARK: devmh.com
        run: node scripts/generate.mjs

      - name: Commit if anything changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets README.md
          if git diff --cached --quiet; then
            echo "panels unchanged — nothing to commit"
          else
            git commit -m "chore: refresh solar panels"
            git push
          fi
